name: ai-video-edeting-machine
services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    init: true
    user: "1000:1000"
    restart: unless-stopped
    env_file:
      - /etc/ai-video-edeting-machine/app.env
    environment:
      HOME: /tmp
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - /srv/ai-video-edeting-machine/data:/data
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
